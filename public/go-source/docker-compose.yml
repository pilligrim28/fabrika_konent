version: '3.8'

services:
  content-factory:
    build: .
    container_name: content-factory
    restart: unless-stopped
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
    environment:
      - TZ=Europe/Moscow
      # Опционально: переменные окружения вместо config.yaml
      # - TELEGRAM_BOT_TOKEN=your_token
      # - OPENAI_API_KEY=your_key
    network_mode: host  # Для доступа к Ollama на localhost:11434
    # Или используйте:
    # networks:
    #   - app-network

  # Опционально: Ollama для локальной генерации текста
